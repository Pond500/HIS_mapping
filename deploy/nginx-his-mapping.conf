# HIS Mapping on the shared server: https://203.185.144.41/his_mapping/
#
# Installed as /etc/nginx/snippets/his-mapping-noauth.conf, included from the :443 server
# block in /etc/nginx/sites-available/sansarnnews-ssl (server_name 203.185.144.41), which
# many other projects share, each under its own prefix. Edit here, copy there, then
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# The app is served under /his_mapping only (2026-11-12, the user's choice: no bare-IP
# front door). nginx strips the prefix (proxy_pass with a trailing slash), so the app's
# routes stay "/login", "/api/..."; the app puts the prefix back on every link, fetch and
# redirect from ROOT_PATH=/his_mapping in .env (app/paths.py). The two must match.
#
# Sign-in is the app's own (app/auth.py); there is no nginx password (the user's decision,
# 2026-10-15). The session cookie is scoped to /his_mapping, so other projects on this
# host never receive it.

location = /his_mapping   { return 301 /his_mapping/; }

# the old addresses: the bare-IP pages and the /his-mapping front door
location = /his-mapping   { return 301 /his_mapping/; }
location = /his-mapping/  { return 301 /his_mapping/; }

# never on the internet: the baseline evaluation's old upload, and the whole app's own
# Swagger (the hospitals' API doc, /his_mapping/api/v1/docs, is a separate app)
location = /his_mapping/api/legacy/upload { return 404; }
location = /his_mapping/docs              { return 404; }
location = /his_mapping/redoc             { return 404; }
location = /his_mapping/openapi.json      { return 404; }

# ^~: a regex location elsewhere in the shared block (e.g. for *.js) must not take our
# static files
location ^~ /his_mapping/ {
    client_max_body_size 25m;
    proxy_http_version    1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout    300s;   # AI conversion can run past a minute

    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;

    proxy_pass http://127.0.0.1:10340/;   # APP_PORT in .env — NOT 8000, another app on this host
}

# This snippet used to own the shared block's catch-all and served the app at "/". The
# bare host is no longer ours; until another project claims "/", it answers 404 rather
# than nginx's default page. Delete this if someone else needs "location /".
location / { return 404; }
